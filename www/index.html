<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H.A.N.S.A</title>
    <link rel="shortcut icon" href="assets/img/hansa.ico">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!-- Bootstrap Icons-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="assets/vendore/texllate/animate.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <section id="Oval" class="mb-4">
            <div class="row">
                <div class="col-md-1"></div>
                <div class="col-md-10">
                    <div id="loader-wrapper">
                        <div id="loader">
                            <div id="loader1">
                            </div>
                        </div>
                        <p>Hansa</p>
                    </div>
                    <h5 class="text-light text text-center">Ask me anything</h5>
                    <h6 class="text-light text-center" style="font-size: 14px; opacity: 0.7;">کچھ بھی پوچھیں</h6>

                    <div class="col-md-12 mt-4 pt-4">
                        <div class="text-center">
                            <div id="textInput" class="d-flex">
                                <input type="text" class="input-field" name="chatbox" id="chatbox"
                                    placeholder="type here ... ">
                                <button id="MicBtn" class="glow-on-hover" title="Voice"><i class="bi bi-mic"></i></button>
                                <button id="ChatBtn" class="glow-on-hover" data-bs-toggle="offcanvas"
                                    data-bs-target="#trainingPanel" aria-controls="trainingPanel" title="Training"><i
                                        class="bi bi-brain"></i></button>
                                <button id="SettingsBtn" class="glow-on-hover" title="Settings"><i class="bi bi-gear"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-1"></div>
            </div>
        </section>

        <section id="SiriWave" class="mb-4" hidden>
            <div class="container">
                <div class="row">
                    <div class="col-md-12">
                        <div class="d-flex justify-content-center align-items-center" style="height: 100vh;">
                            <div>
                                <h5 class="text-start text-light mb-4 siri-message" style="font-size: 26px;">
                                    Hello, I am H.A.N.S.A</h5>
                                <div id="siri-container"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Training Panel Offcanvas -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="trainingPanel" aria-labelledby="trainingLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="trainingLabel">Train Hansa</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body p-0">
            <!-- Nav Tabs -->
            <ul class="nav nav-tabs nav-fill" role="tablist" style="background: #181818;">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="addTab" data-bs-toggle="tab" data-bs-target="#addPanel" type="button" role="tab">Add Command</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="viewTab" data-bs-toggle="tab" data-bs-target="#viewPanel" type="button" role="tab">View Commands</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="statsTab" data-bs-toggle="tab" data-bs-target="#statsPanel" type="button" role="tab">Stats</button>
                </li>
            </ul>

            <!-- Tab Content -->
            <div class="tab-content p-3">
                <!-- Add Command Tab -->
                <div class="tab-pane fade show active" id="addPanel" role="tabpanel">
                    <form id="addCommandForm">
                        <div class="mb-3">
                            <label class="form-label text-light">Command Keyword</label>
                            <input type="text" class="form-control" id="cmdKeyword" placeholder="e.g., play music" required>
                            <small class="text-muted">The trigger word/phrase</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-light">Description</label>
                            <input type="text" class="form-control" id="cmdDescription" placeholder="What does this do?">
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-light">Action Type</label>
                            <select class="form-select" id="actionType" required onchange="updateActionField()">
                                <option value="">Select...</option>
                                <option value="open_app">Open Application</option>
                                <option value="open_url">Open Website</option>
                                <option value="search_youtube">Search YouTube</option>
                                <option value="speak">Just Speak</option>
                                <option value="execute_command">Execute Command</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-light" id="actionLabel">Action Value</label>
                            <input type="text" class="form-control" id="actionValue" placeholder="e.g., notepad.exe or sufi music" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-light">Response</label>
                            <input type="text" class="form-control" id="cmdResponse" placeholder="What Hansa will say">
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-light">Language</label>
                            <select class="form-select" id="cmdLanguage">
                                <option value="en">English</option>
                                <option value="ur">Urdu (اردو)</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-plus-circle"></i> Add Command
                        </button>
                    </form>

                    <div id="addFeedback" class="mt-3" style="display:none;"></div>
                </div>

                <!-- View Commands Tab -->
                <div class="tab-pane fade" id="viewPanel" role="tabpanel">
                    <div id="commandsList" class="command-list">
                        <p class="text-muted">Loading commands...</p>
                    </div>
                </div>

                <!-- Stats Tab -->
                <div class="tab-pane fade" id="statsPanel" role="tabpanel">
                    <div id="statsContent" class="stats-content">
                        <p class="text-muted">Loading stats...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

    <!--Jquery  -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="main.js"></script>

    <!-- Texllate js -->
    <script src="assets/vendore/texllate/jquery.fittext.js"></script>
    <script src="assets/vendore/texllate/jquery.lettering.js"></script>
    <script src="http://jschr.github.io/textillate/jquery.textillate.js"></script>
    <script type="text/javascript" src="/eel.js"></script>

    <!-- Siri wave link -->
    <script src="https://unpkg.com/siriwave/dist/siriwave.umd.min.js"></script>
    <script src="./controller.js"></script>
    <script src="./training.js"></script>
</body>
</html>
